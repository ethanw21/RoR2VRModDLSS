# Builds the native upscaling library the VR mod bundles (Windows x64, MSVC).
# The library cannot be built on Linux: it needs MSVC, the Windows SDK shader compiler
# and AMD's Windows-only shader tool. The result is uploaded as a build artifact.
name: Native upscaling library

on:
  push:
    paths:
      - 'NativeUpscaling/**'
      - '.github/workflows/native-upscaling.yml'
  workflow_dispatch:

# contents: write lets the last step keep the newest build on the
# ci/native-upscaling-build branch (see that step).
permissions:
  contents: write

concurrency:
  group: native-upscaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./NativeUpscaling/build/Build-Native.ps1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vrmod-upscaling-native
          path: NativeUpscaling/build/package/
          if-no-files-found: error
          retention-days: 90
      # Keeps the newest build on its own single-commit branch so it can be fetched with
      # plain git (build artifacts need a signed-in browser). The branch holds only this
      # library, its manifest and the license texts, never the NVIDIA runtime files.
      - name: Publish to the ci/native-upscaling-build branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/NativeUpscaling/build/package"
          work="$RUNNER_TEMP/native-build-branch"
          rm -rf "$work" && mkdir -p "$work"
          cp "$package/patchers/VRMod.Upscaling.Native.dll" "$work/"
          cp "$package/plugins/upscaling/native-manifest.json" "$work/"
          cp -r "$package/plugins/upscaling/licenses" "$work/licenses"
          printf '%s\n' "VRMod.Upscaling.Native.dll built by .github/workflows/native-upscaling.yml" \
            "from commit $GITHUB_SHA ($GITHUB_REF_NAME). Source: NativeUpscaling/ on that commit." > "$work/README.txt"
          cd "$work"
          git init -q -b ci/native-upscaling-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Native upscaling library built from $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/native-upscaling-build
